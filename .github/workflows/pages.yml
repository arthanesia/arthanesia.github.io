name: Deploy Arthanesia Website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app/**"
      - "download/**"
      - "admin/**"
      - "admin-preview.html"
      - "assets/**"
      - "privacy/**"
      - "terms/**"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble complete public website
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp -R admin public/admin
          cp -R app public/app
          cp -R download public/download
          cp -R privacy public/privacy
          cp -R terms public/terms
          cp -R assets public/assets
          cp admin-preview.html public/admin-preview.html
          cp .nojekyll public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

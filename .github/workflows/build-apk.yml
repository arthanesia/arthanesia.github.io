name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arthanesia-v0.7.0-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Arthanesia.apk
          TAG="v0.7.${{ github.run_number }}"
          gh release create "$TAG" Arthanesia.apk --repo "$GITHUB_REPOSITORY" --title "Arthanesia $TAG" --notes "Android build $TAG"

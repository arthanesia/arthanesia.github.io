name: Build Arthanesia Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platforms and build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle --no-daemon -p mobile/android :app:assembleDebug

      - name: Prepare named APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/android/app/build/outputs/apk/debug/Arthanesia.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arthanesia-android-v0.6.2
          path: mobile/android/app/build/outputs/apk/debug/Arthanesia.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.2
          name: Arthanesia Android v0.6.2
          target_commitish: main
          generate_release_notes: true
          draft: false
          prerelease: true
          files: mobile/android/app/build/outputs/apk/debug/Arthanesia.apk
